<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>Instagram Profile Logo (Light Mode) - nexom.dev</title>
    <script src="./assets/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
        font-family: 'Inter', system-ui, sans-serif;
        color: #1c1c2e;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
      }

      /* Canvas Grid Overlay Child (Light Mode) */
      .canvas-bg {
        position: absolute;
        inset: 0;
        background-color: #ffffff;
        background-image: radial-gradient(circle at center, rgba(28, 28, 46, 0.12) 1.5px, transparent 1.6px);
        background-size: 28px 28px;
        z-index: 0;
      }

      /* Glowing Radial Center Soft Light */
      .glow-center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 750px;
        height: 750px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(232, 160, 32, 0.15) 0%, rgba(255, 255, 255, 0) 70%);
        z-index: 1;
      }

      /* Floating Abstract Accent Shapes */
      .shape {
        position: absolute;
        z-index: 2;
        transform-origin: center center;
      }
      .shape-amber-circle {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background: #e8a020;
        top: 140px;
        right: 150px;
      }
      .shape-teal-box {
        width: 90px;
        height: 90px;
        border-radius: 22px;
        background: #3dbfb8;
        bottom: 160px;
        left: 140px;
        transform: rotate(22deg);
      }
      .shape-ring {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 10px solid #e8a020;
        top: 180px;
        left: 160px;
      }

      /* Main Logo Centered Container */
      .logo-container {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }

      /* Central Emblem Avatar (Dark Navy Pill with White N) */
      .emblem-wrapper {
        position: relative;
        margin-bottom: 40px;
      }
      .emblem-outer-ring {
        position: absolute;
        inset: -18px;
        border-radius: 50%;
        border: 3px dashed rgba(232, 160, 32, 0.6);
      }
      .emblem-avatar {
        width: 380px;
        height: 380px;
        border-radius: 50%;
        background: #1c1c2e;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 24px 60px rgba(28, 28, 46, 0.2);
        border: 4px solid #ffffff;
      }
      .emblem-letter {
        font-family: 'JetBrains Mono', monospace;
        font-size: 220px;
        font-weight: 700;
        color: #ffffff;
        line-height: 1;
      }

      /* Text Branding */
      .brand-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 54px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #1c1c2e;
        margin-bottom: 16px;
      }
      .brand-tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 22px;
        letter-spacing: 0.16em;
        color: #1c1c2e;
        text-transform: uppercase;
        font-weight: 700;
        background: rgba(232, 160, 32, 0.15);
        padding: 12px 28px;
        border-radius: 100px;
        border: 1.5px solid rgba(232, 160, 32, 0.4);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1080"
    >
      <div class="canvas-bg"></div>
      <div class="glow-center"></div>

      <!-- Accent Decorative Shapes -->
      <div id="logo-shape-1" class="shape shape-amber-circle"></div>
      <div id="logo-shape-2" class="shape shape-teal-box"></div>
      <div id="logo-shape-3" class="shape shape-ring"></div>

      <!-- Main Logo Content Clip -->
      <section
        id="logo-clip"
        class="clip"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        style="position: absolute; inset: 0;"
      >
        <div class="logo-container">
          <div class="emblem-wrapper">
            <div id="outer-ring" class="emblem-outer-ring"></div>
            <div id="avatar" class="emblem-avatar">
              <span class="emblem-letter">N</span>
            </div>
          </div>

          <h1 id="logo-title" class="brand-title">nexom.dev</h1>
          <div id="logo-tag" class="brand-tag">✦ DESARROLLADORA FREELANCE</div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#avatar", { scale: 0.8, opacity: 0, duration: 0.8, ease: "back.out(1.7)" }, 0.2);
      tl.from("#outer-ring", { opacity: 0, duration: 0.8, ease: "power2.out" }, 0.3);
      tl.from("#logo-title", { y: 30, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.6);
      tl.from("#logo-tag", { scale: 0.9, opacity: 0, duration: 0.5, ease: "back.out(1.5)" }, 0.8);

      tl.to("#outer-ring", { rotation: 180, duration: 5, ease: "none", transformOrigin: "50% 50%" }, 0);
      tl.to("#logo-shape-1", { y: -30, duration: 4, ease: "sine.inOut", repeat: 1, yoyo: true, transformOrigin: "50% 50%" }, 0);
      tl.to("#logo-shape-2", { rotation: 90, duration: 5, ease: "none", transformOrigin: "50% 50%" }, 0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
